# Full write path with every fact in the goal, so ask_user is not needed.
# Creates a real media buy on the target: run against local only.
name: create-media-buy
goal: >
  Create a display media buy for testbrand.com with a total budget of 1 USD,
  starting in 7 days and running for 30 days. Pick the first suitable product.
expect:
  outcome: completed
  calls:
    - tool: get_products
      min: 1
    - tool: create_media_buy
      min: 1
      max: 1
  tool_errors: none
  final_text_contains:
    - "1"
